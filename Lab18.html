<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiment 18: Date Object and Live Digital Clock</title>
    <link rel="stylesheet" href="CSS/Lab18.css" />
  </head>
  <body>
    <main>
      <h1>LIVE DASHBOARD</h1>

      <div class="group">
        <p>
          <span>Today's Date: </span>
          <strong id="currentDate">Loading Date...</strong>
        </p>
      </div>

      <div class="group">
        <p>
          <span>Current Time: </span>
          <strong id="currentTime">Loading Time...</strong>
        </p>
      </div>

      <div class="group">
        <p>
          <span>Live Clock:</span>
          <strong id="liveClock">00:00:00</strong>
        </p>
      </div>
    </main>

    <script src="JS/Lab18.js"></script>
  </body>
</html>
